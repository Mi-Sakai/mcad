[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mcad-geom = { version = "0.9.0", path = "crates/mcad-geom" }
mcad-core = { version = "0.9.0", path = "crates/mcad-core" }
mcad-io = { version = "0.9.0", path = "crates/mcad-io" }
