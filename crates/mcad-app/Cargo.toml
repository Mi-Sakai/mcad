[package]
name = "mcad-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.103"
eframe = "0.35.0"
egui = "0.35.0"
mcad-core = { workspace = true }
mcad-geom = { workspace = true }
mcad-io = { workspace = true }
rfd = "0.17.2"
# 文字アウトライン化（`plot::text_outline`）用。依存グラフには既に 0.25.1 が
# 入っている（winit → sctk-adwaita → ab_glyph → owned_ttf_parser → ttf-parser）ので
# dedup され、ビルドコストはほぼ増えない。Noto Sans JP は OTF(CFF) だが
# CFF アウトラインの取得は feature flag 不要のコア機能。
ttf-parser = "0.25"
# PDF 直列化（`plot::to_pdf`）用。低レベルな PDF オブジェクト/コンテンツストリーム
# 組み立てのみを提供するライブラリで、フォント埋め込み機能は使わない（文字は
# plot::text_outline で既にアウトラインパス化済みのため不要）。依存グラフへの純増分は
# bitflags/itoa/memchr/ryu の4クレートのみで実質ゼロに近い（itoa は既存 Cargo.lock に
# 既に存在）。
pdf-writer = "0.15"
# 設定永続化(config.json)の置き場所解決用(DESIGN.md M8 設計判断8)。
# プラットフォーム標準の設定ディレクトリ(Linux: ~/.config 等)のみに使う。
dirs = "6.0"
# config.json の直列化用。core/io と同じバージョン指定で依存グラフに既に存在するため
# dedupされビルドコストはほぼ増えない。
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
